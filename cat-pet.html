<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面小猫</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 30%, #e8f5e9 60%, #e3f2fd 100%);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    user-select: none;
    cursor: default;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
  }

  .cat-container {
    position: absolute;
    width: 180px;
    height: 200px;
    cursor: grab;
    transition: left 2.5s ease-in-out, top 2.5s ease-in-out;
    z-index: 10;
  }

  .cat-container:active { cursor: grabbing; }
  .cat-container.dragging { transition: none; }
  .cat-container.walking { transition: left 2.5s ease-in-out, top 2.5s ease-in-out; }

  .cat-inner {
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* Idle breathing */
  .cat-svg-wrap {
    width: 100%;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .cat-svg {
    width: 100%;
    height: 100%;
    animation: breathe 2.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    30% { transform: scaleY(1.04) scaleX(0.98); }
    60% { transform: scaleY(0.98) scaleX(1.02); }
  }

  /* Walking body animation */
  .cat-container.walking .cat-svg {
    animation: walkBounce 0.35s ease-in-out infinite;
  }

  @keyframes walkBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-5px) rotate(-2deg); }
    75% { transform: translateY(-5px) rotate(2deg); }
  }

  /* Happy bounce */
  .cat-container.happy .cat-svg {
    animation: happyBounce 0.3s ease-in-out 2;
  }

  @keyframes happyBounce {
    0%, 100% { transform: translateY(0) scaleY(1); }
    40% { transform: translateY(-15px) scaleY(0.9) scaleX(1.08); }
    60% { transform: translateY(-18px) scaleY(1.05) scaleX(0.95); }
    80% { transform: translateY(-5px) scaleY(0.95) scaleX(1.03); }
  }

  /* Walking legs */
  .leg-front-left, .leg-front-right,
  .leg-back-left, .leg-back-right {
    transform-origin: 50% 0%;
    transition: transform 0.15s ease;
  }

  .cat-container.walking .leg-front-left { animation: legWalk1 0.35s ease-in-out infinite; }
  .cat-container.walking .leg-front-right { animation: legWalk2 0.35s ease-in-out infinite; }
  .cat-container.walking .leg-back-left { animation: legWalk2 0.35s ease-in-out infinite; }
  .cat-container.walking .leg-back-right { animation: legWalk1 0.35s ease-in-out infinite; }

  @keyframes legWalk1 {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(15deg); }
  }

  @keyframes legWalk2 {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-15deg); }
  }

  /* Tail wag */
  .tail-group {
    transform-origin: 130px 150px;
    animation: tailWag 3s ease-in-out infinite;
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg); }
    50% { transform: rotate(10deg); }
    70% { transform: rotate(-5deg); }
  }

  /* Blink */
  .eye-lid {
    opacity: 0;
    transition: opacity 0.05s;
  }
  .cat-container.blinking .eye-lid { opacity: 1; }

  /* Happy eyes */
  .eye-happy {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .cat-container.happy .eye-normal { opacity: 0; }
  .cat-container.happy .eye-happy { opacity: 1; }
  .cat-container.happy .mouth-normal { opacity: 0; }
  .cat-container.happy .mouth-happy { opacity: 1; }
  .cat-container.happy .blush { opacity: 0.7; }

  .mouth-happy { opacity: 0; transition: opacity 0.15s; }
  .blush { opacity: 0; transition: opacity 0.15s; }

  /* Speech Bubble */
  .speech-bubble {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 3px solid #FF9F43;
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 15px;
    color: #e65100;
    white-space: nowrap;
    max-width: 280px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 4px 20px rgba(255, 159, 67, 0.25);
    z-index: 20;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 14px solid #fff;
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 17px solid #FF9F43;
  }

  .speech-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-5px);
  }

  /* Hearts burst on click */
  .hearts-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 60%;
    pointer-events: none;
    z-index: 15;
  }

  .heart-particle {
    position: absolute;
    font-size: 20px;
    animation: heartFloat 1.5s ease-out forwards;
    opacity: 0;
  }

  @keyframes heartFloat {
    0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
    30% { opacity: 1; transform: translate(var(--dx30), var(--dy30)) scale(1.2) rotate(var(--r30)); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--r)); }
  }

  /* Ground shadow */
  .shadow {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 12px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.12) 0%, transparent 70%);
    border-radius: 50%;
    transition: all 0.3s ease;
  }

  .cat-container.walking .shadow {
    width: 60px;
    opacity: 0.6;
  }

  /* Footer hint */
  .hint {
    position: fixed;
    bottom: 16px;
    right: 20px;
    font-size: 12px;
    color: #bdbdbd;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="cat-container" id="cat" style="left: 50%; top: 50%;">
  <div class="cat-inner">
    <!-- Speech Bubble -->
    <div class="speech-bubble" id="bubble">赵长萍宝宝天天开心我爱你吖</div>

    <!-- Hearts particles -->
    <div class="hearts-container" id="hearts"></div>

    <!-- Cat SVG -->
    <div class="cat-svg-wrap">
    <svg class="cat-svg" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
        </filter>
        <radialGradient id="bodyGrad" cx="45%" cy="40%">
          <stop offset="0%" stop-color="#FFB347"/>
          <stop offset="70%" stop-color="#FF9F43"/>
          <stop offset="100%" stop-color="#F57C00"/>
        </radialGradient>
        <radialGradient id="bellyGrad" cx="50%" cy="40%">
          <stop offset="0%" stop-color="#FFFDF5"/>
          <stop offset="100%" stop-color="#FFF5E0"/>
        </radialGradient>
      </defs>

      <!-- Tail -->
      <g class="tail-group">
        <path d="M 155 155 Q 180 140 190 115 Q 195 95 185 85"
              stroke="url(#bodyGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <path d="M 185 85 Q 178 78 180 70"
              stroke="#FFFDF5" stroke-width="10" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Back legs -->
      <g>
        <ellipse class="leg-back-left" cx="95" cy="185" rx="16" ry="14" fill="#F57C00"/>
        <ellipse class="leg-back-left" cx="95" cy="195" rx="12" ry="7" fill="#FFF5E0"/>
        <ellipse class="leg-back-right" cx="125" cy="185" rx="16" ry="14" fill="#F57C00"/>
        <ellipse class="leg-back-right" cx="125" cy="195" rx="12" ry="7" fill="#FFF5E0"/>
      </g>

      <!-- Body -->
      <ellipse cx="110" cy="145" rx="55" ry="45" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
      <!-- Belly -->
      <ellipse cx="108" cy="152" rx="35" ry="30" fill="url(#bellyGrad)"/>

      <!-- Body stripes -->
      <path d="M 75 135 Q 80 130 85 138" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M 70 145 Q 75 140 80 148" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M 135 135 Q 130 130 125 138" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M 140 145 Q 135 140 130 148" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

      <!-- Front legs -->
      <g class="leg-front-left">
        <ellipse cx="78" cy="182" rx="15" ry="15" fill="#FF9F43"/>
        <ellipse cx="76" cy="193" rx="11" ry="7" fill="#FFF5E0"/>
        <ellipse cx="72" cy="194" rx="3" ry="2.5" fill="#FFB3BA"/>
        <ellipse cx="76" cy="193" rx="3" ry="2.5" fill="#FFB3BA"/>
        <ellipse cx="80" cy="194" rx="3" ry="2.5" fill="#FFB3BA"/>
      </g>
      <g class="leg-front-right">
        <ellipse cx="132" cy="182" rx="15" ry="15" fill="#FF9F43"/>
        <ellipse cx="134" cy="193" rx="11" ry="7" fill="#FFF5E0"/>
        <ellipse cx="130" cy="194" rx="3" ry="2.5" fill="#FFB3BA"/>
        <ellipse cx="134" cy="193" rx="3" ry="2.5" fill="#FFB3BA"/>
        <ellipse cx="138" cy="194" rx="3" ry="2.5" fill="#FFB3BA"/>
      </g>

      <!-- Head -->
      <circle cx="108" cy="82" r="42" fill="url(#bodyGrad)"/>

      <!-- Ears -->
      <polygon points="72,55 65,20 90,48" fill="#FF9F43"/>
      <polygon points="72,52 68,28 86,48" fill="#FFB3BA"/>
      <polygon points="144,55 151,20 126,48" fill="#FF9F43"/>
      <polygon points="144,52 148,28 130,48" fill="#FFB3BA"/>

      <!-- Face white patch -->
      <ellipse cx="108" cy="90" rx="28" ry="22" fill="url(#bellyGrad)"/>

      <!-- Eyes normal -->
      <g class="eye-normal">
        <!-- Left eye -->
        <ellipse cx="93" cy="78" rx="10" ry="11" fill="#fff" stroke="#333" stroke-width="1.2"/>
        <circle cx="95" cy="77" r="5.5" fill="#333"/>
        <circle cx="97" cy="74.5" r="1.8" fill="#fff"/>
        <!-- Right eye -->
        <ellipse cx="123" cy="78" rx="10" ry="11" fill="#fff" stroke="#333" stroke-width="1.2"/>
        <circle cx="125" cy="77" r="5.5" fill="#333"/>
        <circle cx="127" cy="74.5" r="1.8" fill="#fff"/>
      </g>

      <!-- Eyes happy (^_^) -->
      <g class="eye-happy">
        <!-- Left happy eye -->
        <path d="M 83 72 Q 88 66 93 72" stroke="#333" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <!-- Right happy eye -->
        <path d="M 113 72 Q 118 66 123 72" stroke="#333" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Blink lids -->
      <g class="eye-lid">
        <rect x="82" y="73" width="24" height="14" rx="5" fill="#FF9F43"/>
        <rect x="112" y="73" width="24" height="14" rx="5" fill="#FF9F43"/>
      </g>

      <!-- Blush -->
      <g class="blush">
        <ellipse cx="82" cy="86" rx="8" ry="4" fill="#FFB3BA" opacity="0.8"/>
        <ellipse cx="134" cy="86" rx="8" ry="4" fill="#FFB3BA" opacity="0.8"/>
      </g>

      <!-- Nose -->
      <polygon points="108,84 104,88 112,88" fill="#FF6B6B"/>

      <!-- Mouth normal -->
      <g class="mouth-normal">
        <path d="M 104 92 Q 108 95 108 92 Q 108 95 112 92" stroke="#333" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Mouth happy -->
      <g class="mouth-happy">
        <path d="M 100 90 Q 108 100 116 90" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 108 91 L 108 95" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Whiskers left -->
      <line x1="65" y1="82" x2="85" y2="86" stroke="#795548" stroke-width="1" opacity="0.5"/>
      <line x1="63" y1="88" x2="84" y2="89" stroke="#795548" stroke-width="1" opacity="0.5"/>
      <line x1="65" y1="94" x2="85" y2="92" stroke="#795548" stroke-width="1" opacity="0.5"/>

      <!-- Whiskers right -->
      <line x1="135" y1="82" x2="151" y2="86" stroke="#795548" stroke-width="1" opacity="0.5"/>
      <line x1="136" y1="88" x2="153" y2="89" stroke="#795548" stroke-width="1" opacity="0.5"/>
      <line x1="135" y1="94" x2="151" y2="92" stroke="#795548" stroke-width="1" opacity="0.5"/>
    </svg>
    </div>

    <!-- Shadow -->
    <div class="shadow"></div>
  </div>
</div>

<div class="hint">点击猫咪互动 | 按住拖动 | 猫咪会自己散步 🐱</div>

<script>
(function() {
  const cat = document.getElementById('cat');
  const bubble = document.getElementById('bubble');
  const heartsContainer = document.getElementById('hearts');

  // State
  let isDragging = false;
  let isWalking = false;
  let isHappy = false;
  let dragStartX, dragStartY;
  let catStartLeft, catStartTop;
  let walkTimer = null;
  let happyTimer = null;
  let blinkInterval = null;
  let walkPauseTimer = null;
  let isWalkPaused = false;

  // Start cat at a nice position
  function initPosition() {
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    cat.style.left = (ww / 2 - 90) + 'px';
    cat.style.top = (wh / 2 - 100) + 'px';
  }

  // Blinking
  function scheduleBlink() {
    const delay = 2000 + Math.random() * 5000;
    blinkInterval = setTimeout(() => {
      cat.classList.add('blinking');
      setTimeout(() => {
        cat.classList.remove('blinking');
        scheduleBlink();
      }, 150);
    }, delay);
  }

  // Spawn hearts
  function spawnHearts() {
    const count = 8;
    const emojis = ['💕', '💖', '💗', '💝', '✨', '💛'];
    for (let i = 0; i < count; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart-particle';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = (30 + Math.random() * 50) + '%';
      heart.style.top = (20 + Math.random() * 30) + '%';
      heart.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px');
      heart.style.setProperty('--dy', (-60 - Math.random() * 80) + 'px');
      heart.style.setProperty('--dx30', (Math.random() * 30 - 15) + 'px');
      heart.style.setProperty('--dy30', (-15 - Math.random() * 20) + 'px');
      heart.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
      heart.style.setProperty('--r30', (Math.random() * 30 - 15) + 'deg');
      heart.style.animationDuration = (1 + Math.random() * 1.5) + 's';
      heartsContainer.appendChild(heart);

      setTimeout(() => heart.remove(), 2000);
    }
  }

  // Happy state
  function setHappy() {
    if (isHappy) return;
    isHappy = true;
    cat.classList.add('happy');
    bubble.classList.add('show');
    spawnHearts();

    // Reset after 4 seconds
    if (happyTimer) clearTimeout(happyTimer);
    happyTimer = setTimeout(() => {
      cat.classList.remove('happy');
      bubble.classList.remove('show');
      isHappy = false;
    }, 4000);
  }

  // Walk to random position
  function walkToRandom() {
    if (isDragging || isHappy || isWalking || isWalkPaused) return;

    isWalking = true;
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    const maxX = ww - 180;
    const maxY = wh - 200;
    const targetX = Math.max(0, Math.random() * maxX);
    const targetY = Math.max(0, Math.random() * maxY);

    // Face direction based on movement (flip only SVG wrapper, not bubble)
    const currentLeft = parseFloat(cat.style.left) || 0;
    const wrap = cat.querySelector('.cat-svg-wrap');
    if (targetX < currentLeft) {
      wrap.style.transform = 'scaleX(-1)';
    } else {
      wrap.style.transform = 'scaleX(1)';
    }

    cat.classList.add('walking');
    cat.style.left = targetX + 'px';
    cat.style.top = targetY + 'px';

    // Stop walking after transition
    setTimeout(() => {
      cat.classList.remove('walking');
      isWalking = false;
      scheduleNextWalk();
    }, 2600);
  }

  function scheduleNextWalk() {
    if (walkTimer) clearTimeout(walkTimer);
    const delay = 8000 + Math.random() * 15000;
    walkTimer = setTimeout(walkToRandom, delay);
  }

  // Pause walking after drag
  function pauseWalking() {
    isWalkPaused = true;
    if (walkTimer) clearTimeout(walkTimer);
    if (walkPauseTimer) clearTimeout(walkPauseTimer);
    walkPauseTimer = setTimeout(() => {
      isWalkPaused = false;
      scheduleNextWalk();
    }, 5000);
  }

  // Dragging
  cat.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    catStartLeft = parseFloat(cat.style.left) || 0;
    catStartTop = parseFloat(cat.style.top) || 0;
    cat.classList.add('dragging');
    cat.classList.remove('walking');
    cat.style.transition = 'none';
    if (walkTimer) clearTimeout(walkTimer);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    cat.style.left = (catStartLeft + dx) + 'px';
    cat.style.top = (catStartTop + dy) + 'px';
  });

  document.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    cat.classList.remove('dragging');
    cat.style.transition = '';
    const dx = Math.abs(e.clientX - dragStartX);
    const dy = Math.abs(e.clientY - dragStartY);

    if (dx < 5 && dy < 5) {
      // It was a click, not a drag
      setHappy();
    }

    pauseWalking();
  });

  // Touch support
  cat.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    isDragging = true;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    catStartLeft = parseFloat(cat.style.left) || 0;
    catStartTop = parseFloat(cat.style.top) || 0;
    cat.classList.add('dragging');
    cat.classList.remove('walking');
    cat.style.transition = 'none';
    if (walkTimer) clearTimeout(walkTimer);
  });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;
    cat.style.left = (catStartLeft + dx) + 'px';
    cat.style.top = (catStartTop + dy) + 'px';
  });

  document.addEventListener('touchend', (e) => {
    if (!isDragging) return;
    isDragging = false;
    cat.classList.remove('dragging');
    cat.style.transition = '';
    const dx = Math.abs((e.changedTouches[0]?.clientX || 0) - dragStartX);
    const dy = Math.abs((e.changedTouches[0]?.clientY || 0) - dragStartY);

    if (dx < 5 && dy < 5) {
      setHappy();
    }

    pauseWalking();
  });

  // Resize handler
  window.addEventListener('resize', () => {
    const l = parseFloat(cat.style.left) || 0;
    const t = parseFloat(cat.style.top) || 0;
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    if (l > ww - 180) cat.style.left = Math.max(0, ww - 180) + 'px';
    if (t > wh - 200) cat.style.top = Math.max(0, wh - 200) + 'px';
  });

  // Init
  initPosition();
  scheduleBlink();
  scheduleNextWalk();
})();
</script>
</body>
</html>
